name: Deploy web-client-app

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image version
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -f dockerfile.prod \
            -t web-client-app:${IMAGE_TAG} \
            .

      - name: Save Docker image
        run: |
          docker save \
            web-client-app:${IMAGE_TAG} \
            -o web-client-app.tar

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Transfer Docker image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            web-client-app.tar \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/$DEPLOY_USER/web-client-app.tar"

      - name: Load Docker image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker load -i /home/$DEPLOY_USER/web-client-app.tar"

      - name: Deploy and rollback if needed
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE_TAG=$IMAGE_TAG bash -s" <<'EOF'

          set -e

          CURRENT_IMAGE=$(docker inspect \
            --format='{{.Config.Image}}' \
            web-client-app 2>/dev/null || true)

          echo "Current image: ${CURRENT_IMAGE:-none}"
          echo "New image: web-client-app:$IMAGE_TAG"

          if [ -n "$CURRENT_IMAGE" ]; then
            docker rm -f web-client-app
          fi

          docker run -d \
            --name web-client-app \
            -p 8080:80 \
            web-client-app:$IMAGE_TAG

          echo "Container started."

          echo "========== DEBUG: docker ps =========="
          docker ps -a

          echo "========== DEBUG: container status =========="
          docker inspect web-client-app \
            --format='Status: {{.State.Status}} | Running: {{.State.Running}} | StartedAt: {{.State.StartedAt}}'

          echo "========== DEBUG: port mapping =========="
          docker inspect web-client-app \
            --format='{{.NetworkSettings.Ports}}'

          echo "========== DEBUG: container logs =========="
          docker logs web-client-app

          echo "========== DEBUG: host port 8080 =========="
          ss -lntp | grep ':8080' || true

          echo "========== DEBUG: curl 127.0.0.1 =========="
          curl -v http://127.0.0.1:8080 || true

          echo "========== DEBUG: curl localhost =========="
          curl -v http://localhost:8080 || true

          echo "========== END DEBUG =========="

          echo "Waiting for application..."

          if curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8080; then
            echo "Deployment successful."
          else
            echo "Health check failed."
            echo "Rolling back..."

            docker rm -f web-client-app 2>/dev/null || true

            if [ -n "$CURRENT_IMAGE" ]; then
              docker run -d \
                --name web-client-app \
                -p 8080:80 \
                "$CURRENT_IMAGE"

              echo "Rollback started."

              if curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8080; then
                echo "Rollback successful."
              else
                echo "Rollback health check failed."
                exit 1
              fi
            else
              echo "No previous version available for rollback."
              exit 1
            fi
          fi

          rm -f /home/$DEPLOY_USER/web-client-app.tar

          EOF