name: Deploy web-client-app

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: web-client-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image version
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -f dockerfile.prod \
            -t ${IMAGE_NAME}:${IMAGE_TAG} \
            .

      - name: Save Docker image
        run: |
          docker save \
            ${IMAGE_NAME}:${IMAGE_TAG} \
            -o ${IMAGE_NAME}.tar

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${IMAGE_NAME}.tar \
            "$DEPLOY_USER@$DEPLOY_HOST:/home/$DEPLOY_USER/${IMAGE_NAME}.tar"

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE_NAME=$IMAGE_NAME IMAGE_TAG=$IMAGE_TAG DEPLOY_USER=$DEPLOY_USER bash -s" <<'EOF'

          set -e

          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
          ARCHIVE="/home/${DEPLOY_USER}/${IMAGE_NAME}.tar"

          cleanup() {
            rm -f "$ARCHIVE"
          }

          trap cleanup EXIT

          echo "Loading image: $IMAGE"

          docker load -i "$ARCHIVE"

          CURRENT_IMAGE=$(docker inspect \
            --format='{{.Config.Image}}' \
            "$IMAGE_NAME" 2>/dev/null || true)

          echo "Current image: ${CURRENT_IMAGE:-none}"
          echo "New image: $IMAGE"

          echo "Stopping previous container..."

          docker rm -f "$IMAGE_NAME" 2>/dev/null || true

          echo "Starting new container..."

          docker run -d \
            --name "$IMAGE_NAME" \
            -p 8080:80 \
            "$IMAGE"

          echo "Waiting for application..."

          if curl \
            --fail \
            --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://localhost:8080; then

            echo "Deployment successful."

          else

            echo "Health check failed."
            echo "Rolling back..."

            docker rm -f "$IMAGE_NAME" 2>/dev/null || true

            if [ -n "$CURRENT_IMAGE" ]; then

              echo "Starting previous image: $CURRENT_IMAGE"

              docker run -d \
                --name "$IMAGE_NAME" \
                -p 8080:80 \
                "$CURRENT_IMAGE"

              echo "Checking rollback..."

              if curl \
                --fail \
                --retry 10 \
                --retry-delay 2 \
                --retry-connrefused \
                http://localhost:8080; then

                echo "Rollback successful."

              else

                echo "Rollback health check failed."
                exit 1

              fi

            else

              echo "No previous image available for rollback."
              exit 1

            fi

          fi

          EOF
